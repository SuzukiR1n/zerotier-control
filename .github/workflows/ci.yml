name: Check and Docker
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLANET_ENDPOINTS: 172.30.0.2/9993
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - name: Run application tests
        timeout-minutes: 2
        run: npm test
      - run: python3 -m unittest discover -s test -p '*_test.py'
      - name: Validate installer shell
        run: |
          bash -n deploy.sh
          bash -n test/docker-pull-fault.sh
          bash -n deploy/downloads.sh
          shellcheck deploy.sh deploy/downloads.sh test/docker-pull-fault.sh test/downloads_test.sh test/download_images_test.sh planet/download-source.sh
          bash test/downloads_test.sh
          bash test/download_images_test.sh
      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f deploy/compose.demo.yaml config --quiet
          docker compose -f compose.yaml -f deploy/compose.ci.yaml config --quiet
      - name: Build Web image and check demo
        run: |
          docker build -t zerotier-control:test .
          docker run -d --name control-test -p 127.0.0.1:8080:8080 -e DEMO_MODE=true -e DEMO_ALLOW_REMOTE=true zerotier-control:test
          trap 'docker logs control-test; docker rm -f control-test' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/api/session | python3 -c 'import json,sys; assert json.load(sys.stdin)["demo"] is True'
      - name: Fresh Planet and actual ZeroTier 1.16.2 integration
        run: |
          mkdir -p /tmp/zt-control-ci
          mkdir -p /tmp/zt-control-ci/bin /tmp/zt-control-ci/pull-fault
          cp test/docker-pull-fault.sh /tmp/zt-control-ci/bin/docker
          chmod +x /tmp/zt-control-ci/bin/docker
          node_binary="$(command -v node)"
          trap 'docker logs zt-client-ci || true; docker rm -f zt-client-ci || true; sudo docker compose -p control-ci -f compose.yaml -f deploy/compose.ci.yaml logs; sudo docker compose -p control-ci -f compose.yaml -f deploy/compose.ci.yaml down -v; docker rm -f registry-ci || true' EXIT
          docker run -d --name registry-ci -p 127.0.0.1:5000:5000 registry:2
          for image in node:24-bookworm-slim debian:bookworm-slim python:3.13-slim-bookworm nginx:stable-alpine; do
            docker pull "docker.io/library/$image"
            docker tag "docker.io/library/$image" "127.0.0.1:5000/library/$image"
            docker push "127.0.0.1:5000/library/$image"
          done
          docker image rm 127.0.0.1:5000/library/nginx:stable-alpine
          sudo bash deploy.sh downloads --docker-registry 127.0.0.1:5001 --docker-fallbacks 127.0.0.1:5000 --github-proxy direct
          sudo env PATH="/tmp/zt-control-ci/bin:$PATH" bash deploy.sh install --ip 172.30.0.2 --zt-port 19993 --web-port 8080 --access local --project-name control-ci --compose-file deploy/compose.ci.yaml
          test "$(sudo cat /tmp/zt-control-ci/pull-fault/attempts)" -eq 3
          test "$(sudo cat /tmp/zt-control-ci/pull-fault/primary-attempts | wc -l)" -eq 3
          sudo grep -Fx 'DOCKER_REGISTRY=127.0.0.1:5000' .download.env
          sudo grep -Fx 'DOCKER_REGISTRY_FALLBACKS=127.0.0.1:5000' .download.env
          sudo "$node_binary" test/container-check.js
          docker create --name zt-client-ci --network control-ci_default --cap-add NET_ADMIN --device /dev/net/tun --entrypoint zerotier-one zerotier-control-planet:1.16.2 -U -p9993 /var/lib/zerotier-one
          docker cp /tmp/zt-control-ci/planet zt-client-ci:/var/lib/zerotier-one/planet
          docker start zt-client-ci
          sudo "$node_binary" test/client-check.js
          docker rm -f zt-client-ci
          before_containers="$(sudo docker compose -p control-ci -f compose.yaml -f deploy/compose.ci.yaml ps -q | sort)"
          sudo cp .download.env /tmp/zt-control-ci/download-profile-before
          sudo sh -c ': > /tmp/zt-control-ci/pull-fault/permanent; echo 0 > /tmp/zt-control-ci/pull-fault/attempts'
          if sudo env PATH="/tmp/zt-control-ci/bin:$PATH" bash deploy.sh install --compose-file deploy/compose.ci.yaml; then
            echo 'A permanent pull failure must stop deployment'; exit 1
          fi
          test "$(sudo cat /tmp/zt-control-ci/pull-fault/attempts)" -eq 3
          test "$before_containers" = "$(sudo docker compose -p control-ci -f compose.yaml -f deploy/compose.ci.yaml ps -q | sort)"
          sudo cmp .download.env /tmp/zt-control-ci/download-profile-before
          sudo "$node_binary" test/container-check.js --after-restart
          echo 'Unavailable primary switched to fallback; pull retries recovered; permanent failure preserved configuration and running containers.'
          sudo bash deploy.sh install --compose-file deploy/compose.ci.yaml
          sudo "$node_binary" test/container-check.js --after-restart
          sudo bash deploy.sh update --skip-pull --compose-file deploy/compose.ci.yaml
          sudo "$node_binary" test/container-check.js --after-restart
          sudo bash deploy.sh reset-password --compose-file deploy/compose.ci.yaml
          sudo "$node_binary" test/container-check.js --after-reset
          sudo "$node_binary" test/deployment-check.js
          sudo bash deploy.sh uninstall --compose-file deploy/compose.ci.yaml
          sudo bash deploy.sh install --compose-file deploy/compose.ci.yaml
          sudo "$node_binary" test/container-check.js --after-restart
