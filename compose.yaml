# Fresh standalone installation: Planet + controller + modern management UI.
services:
  controller:
    build:
      context: .
      dockerfile: Dockerfile.zerotier
    image: zerotier-control-planet:1.16.2
    restart: unless-stopped
    init: true
    environment:
      ZT_PORT: ${ZT_PORT:-9993}
      PLANET_ENDPOINTS: ${PLANET_ENDPOINTS:?请填写公网 IP/端口}
    ports:
      - "${ZT_PORT:-9993}:${ZT_PORT:-9993}/udp"
    volumes:
      - zerotier-data:/var/lib/zerotier-one
      - controller-access:/run/controller
      - planet-files:/app/planet
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  control:
    build: .
    image: zerotier-control:local
    restart: unless-stopped
    init: true
    user: "0:0"
    network_mode: service:controller
    depends_on:
      controller:
        condition: service_healthy
    environment:
      ZT_API_URL: http://127.0.0.1:${ZT_PORT:-9993}
      ZT_TOKEN_FILE: /run/controller/authtoken.secret
      ADMIN_PASSWORD_FILE: /run/secrets/admin-password
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SOCKET_PATH: /run/zt-control/web.sock
      PLANET_DIR: /app/planet
    volumes:
      - type: bind
        source: ${ADMIN_PASSWORD_PATH:-./secrets/admin-password}
        target: /run/secrets/admin-password
        read_only: true
        bind:
          create_host_path: false
      - controller-access:/run/controller:ro
      - planet-files:/app/planet:ro
      - control-socket:/run/zt-control
      - control-data:/app/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    depends_on:
      control:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - control-socket:/run/zt-control:ro
volumes:
  zerotier-data:
  controller-access:
  planet-files:
  control-socket:
  control-data:
