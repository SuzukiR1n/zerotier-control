server {
    listen 8080;
    server_name _;
    client_max_body_size 64k;
    location / {
        proxy_pass http://unix:/run/zt-control/web.sock:;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
