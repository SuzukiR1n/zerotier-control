# 无需重建 Planet 容器：管理后端共享其网络空间，通过 Unix socket 让入口容器提供网页。
services:
  control:
    build:
      context: ..
    image: zerotier-control:local
    restart: unless-stopped
    init: true
    network_mode: container:${ZT_CONTAINER_NAME:-myztplanet}
    user: "0:0"
    environment:
      ZT_API_URL: http://127.0.0.1:${ZT_PORT:-9994}
      ZT_TOKEN_FILE: /run/secrets/zt-token
      ADMIN_PASSWORD_FILE: /run/secrets/admin-password
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SOCKET_PATH: /run/zt-control/web.sock
    volumes:
      - type: bind
        source: ${ZT_TOKEN_PATH:?请设置 Planet 容器的宿主机 authtoken.secret 路径}
        target: /run/secrets/zt-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ADMIN_PASSWORD_PATH:?请设置 ADMIN_PASSWORD_PATH 的绝对路径}
        target: /run/secrets/admin-password
        read_only: true
        bind:
          create_host_path: false
      - control-socket:/run/zt-control
      - control-data:/app/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      control:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - control-socket:/run/zt-control:ro
volumes:
  control-data:
  control-socket:
